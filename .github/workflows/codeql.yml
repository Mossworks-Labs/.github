name: CodeQL
# ─────────────────────────────────────────────────────────────────────────
# PUBLIC-CONSUMER COPY — restored after the 2026-05-08 move to
# Mossworks-Labs/actions broke every public caller (mcp-*): public repos
# cannot call reusable workflows living in a private repo, and cannot see
# the private-visibility org var DEFAULT_RUNNER_NAME (self-hosted runners
# on public repos are a fork-PR security risk anyway).
# Canonical version: Mossworks-Labs/actions/.github/workflows (private) —
# when updating it, mirror the change here (runner lines excepted).
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      languages:
        description: "Comma-separated CodeQL languages (javascript, python, etc.)"
        type: string
        default: "javascript"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(format('["{0}"]', inputs.languages)) }}
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

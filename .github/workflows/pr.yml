name: PR Validation

# Reusable workflow that runs the org-standard PR validation checks.
# Each repo invokes it via `.github/workflows/pr.yml` (a thin trampoline)
# and configures which checks run via `.github/pr_validation.yml` in the
# repo root. With no config file the defaults match a standard Node /
# TypeScript repo: lint + typecheck + format-check + build + test.
# Optional checks (docker, helm-lint, pulumi-preview, storybook) are off
# by default — the per-repo config opts them in.
#
# The org-level ruleset enforces the `PR / aggregate` status check, so
# whatever this workflow's aggregate verdict is gates merges.
#
# Schema reference + examples:
#   https://github.com/Mossworks-Labs/.github/blob/main/docs/pr-validation.md

on:
  # Two trigger modes:
  #   1. workflow_call — invoked by per-repo trampolines. Trampoline can
  #      pass repo-specific secrets (NODE_AUTH_TOKEN, build-secrets,
  #      PULUMI_ACCESS_TOKEN) and override runs-on/node-version.
  #   2. pull_request — eligible to be set as an org-level required
  #      workflow via repository ruleset (GitHub requires one of
  #      pull_request / pull_request_target / merge_queue for that). When
  #      injected this way, inputs use defaults and only the repo's own
  #      `secrets.GITHUB_TOKEN` is available — repos that need the docker
  #      or pulumi-preview checks must add a trampoline so the relevant
  #      secrets can flow through.
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label. Defaults to ubuntu-latest; override to a self-hosted runner via the trampoline."
        type: string
        default: "ubuntu-latest"
      node-version:
        description: "Node.js version for the npm-based checks. Defaults to 22 (the org's pinned major)."
        type: string
        default: "22"
      working-directory:
        description: "Working directory the npm-based checks run in. Defaults to repo root."
        type: string
        default: "."
    secrets:
      NODE_AUTH_TOKEN:
        description: "GitHub PAT with read:packages scope for installing private @mossworks-labs npm packages. Forwarded to npm ci as NODE_AUTH_TOKEN. The trampoline typically passes secrets.GITHUB_TOKEN for org-internal repos."
        required: false
      build-secrets:
        description: "Multi-line KEY=VALUE BuildKit secrets forwarded to docker build (e.g. NODE_AUTH_TOKEN=...). Used only when the docker check is enabled. The values never land in image layers — Dockerfile must consume via `--mount=type=secret,id=KEY`."
        required: false
      PULUMI_ACCESS_TOKEN:
        description: "Pulumi Cloud access token for the pulumi-preview check. Required when `checks.pulumi-preview` is true."
        required: false
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  # ─── Parse the per-repo config and emit toggles + parameters ─────────────
  # Single source of truth: every other job reads from `needs.parse-config.outputs`.
  # Missing or empty values fall back to the documented defaults.
  parse-config:
    name: PR / parse-config
    runs-on: ${{ inputs.runs-on }}
    outputs:
      lint-enabled: ${{ steps.cfg.outputs.lint-enabled }}
      typecheck-enabled: ${{ steps.cfg.outputs.typecheck-enabled }}
      format-check-enabled: ${{ steps.cfg.outputs.format-check-enabled }}
      build-enabled: ${{ steps.cfg.outputs.build-enabled }}
      test-enabled: ${{ steps.cfg.outputs.test-enabled }}
      docker-enabled: ${{ steps.cfg.outputs.docker-enabled }}
      docker-images: ${{ steps.cfg.outputs.docker-images }}
      helm-lint-enabled: ${{ steps.cfg.outputs.helm-lint-enabled }}
      helm-charts-dir: ${{ steps.cfg.outputs.helm-charts-dir }}
      pulumi-preview-enabled: ${{ steps.cfg.outputs.pulumi-preview-enabled }}
      pulumi-project-dir: ${{ steps.cfg.outputs.pulumi-project-dir }}
      pulumi-stack: ${{ steps.cfg.outputs.pulumi-stack }}
      storybook-enabled: ${{ steps.cfg.outputs.storybook-enabled }}
      script-lint: ${{ steps.cfg.outputs.script-lint }}
      script-typecheck: ${{ steps.cfg.outputs.script-typecheck }}
      script-format-check: ${{ steps.cfg.outputs.script-format-check }}
      script-build: ${{ steps.cfg.outputs.script-build }}
      script-test: ${{ steps.cfg.outputs.script-test }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure yq is available
        shell: bash
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=".github/pr_validation.yml"
          if [ ! -f "$CONFIG" ] && [ -f ".github/pr_validation.yaml" ]; then
            CONFIG=".github/pr_validation.yaml"
          fi

          # Read a yq path from the config; fall back to $2 when the key
          # is missing/null/empty. NB: we intentionally don't use yq's
          # `//` operator because it treats `false` as missing — which
          # would make `lint: false` quietly become the default `true`.
          v() {
            local path="$1" default="$2" out=""
            if [ -f "$CONFIG" ]; then
              out=$(yq eval "$path" "$CONFIG" 2>/dev/null || true)
            fi
            if [ -z "$out" ] || [ "$out" = "null" ]; then
              out="$default"
            fi
            printf '%s' "$out"
          }

          # Standard Node/TS checks default to true.
          {
            printf 'lint-enabled=%s\n'         "$(v '.checks.lint'         'true')"
            printf 'typecheck-enabled=%s\n'    "$(v '.checks.typecheck'    'true')"
            printf 'format-check-enabled=%s\n' "$(v '.checks.format-check' 'true')"
            printf 'build-enabled=%s\n'        "$(v '.checks.build'        'true')"
            printf 'test-enabled=%s\n'         "$(v '.checks.test'         'true')"
            # Optional checks default to false; opt in via per-repo config.
            printf 'docker-enabled=%s\n'         "$(v '.checks.docker'         'false')"
            printf 'helm-lint-enabled=%s\n'      "$(v '.checks.helm-lint'      'false')"
            printf 'pulumi-preview-enabled=%s\n' "$(v '.checks.pulumi-preview' 'false')"
            printf 'storybook-enabled=%s\n'      "$(v '.checks.storybook'      'false')"
            # Script overrides — defaults match the package.json scripts
            # used across the org.
            printf 'script-lint=%s\n'         "$(v '.scripts.lint'         'lint')"
            printf 'script-typecheck=%s\n'    "$(v '.scripts.typecheck'    'typecheck')"
            printf 'script-format-check=%s\n' "$(v '.scripts.format-check' 'format:check')"
            printf 'script-build=%s\n'        "$(v '.scripts.build'        'build')"
            printf 'script-test=%s\n'         "$(v '.scripts.test'         'test')"
            # Helm + Pulumi paths
            printf 'helm-charts-dir=%s\n'    "$(v '.helm.charts-dir'    'charts')"
            printf 'pulumi-project-dir=%s\n' "$(v '.pulumi.project-dir' '.')"
            printf 'pulumi-stack=%s\n'       "$(v '.pulumi.stack'       '')"
          } >> "$GITHUB_OUTPUT"

          # Docker images list — emit as compact JSON for the matrix
          # consumer. When docker is disabled (or no images defined),
          # emit `[]` so the docker job's `if:` guard skips it.
          if [ -f "$CONFIG" ] && [ "$(v '.checks.docker' 'false')" = "true" ]; then
            images=$(yq eval -o=json -I=0 '.docker.images // []' "$CONFIG")
          else
            images='[]'
          fi
          echo "docker-images=$images" >> "$GITHUB_OUTPUT"

          {
            echo "### Parsed config"
            echo
            echo '```'
            if [ -f "$CONFIG" ]; then
              cat "$CONFIG"
            else
              echo "(no .github/pr_validation.yml — using defaults)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Standard Node/TS checks ─────────────────────────────────────────────
  # Each job runs `npm ci` then `npm run <script> --if-present`, so a repo
  # without the script just no-ops and passes. Override script names via
  # `scripts.*` in `.github/pr_validation.yml`.

  lint:
    name: PR / Lint
    needs: parse-config
    if: needs.parse-config.outputs.lint-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mossworks-labs'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run ${{ needs.parse-config.outputs.script-lint }} --if-present

  typecheck:
    name: PR / Typecheck
    needs: parse-config
    if: needs.parse-config.outputs.typecheck-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mossworks-labs'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run ${{ needs.parse-config.outputs.script-typecheck }} --if-present

  format-check:
    name: PR / Format
    needs: parse-config
    if: needs.parse-config.outputs.format-check-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mossworks-labs'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run ${{ needs.parse-config.outputs.script-format-check }} --if-present

  build:
    name: PR / Build
    needs: parse-config
    if: needs.parse-config.outputs.build-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mossworks-labs'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run ${{ needs.parse-config.outputs.script-build }} --if-present

  test:
    name: PR / Test
    needs: parse-config
    if: needs.parse-config.outputs.test-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mossworks-labs'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run ${{ needs.parse-config.outputs.script-test }} --if-present

  # ─── Optional checks (opt in via .github/pr_validation.yml) ──────────────

  docker:
    name: PR / Docker (${{ matrix.image.name }})
    needs: parse-config
    # Skip when docker is disabled OR the images list is empty.
    if: |
      needs.parse-config.outputs.docker-enabled == 'true' &&
      needs.parse-config.outputs.docker-images != '[]'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.parse-config.outputs.docker-images) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build (push:false on PRs)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile || 'Dockerfile' }}
          target: ${{ matrix.image.target || '' }}
          push: false
          tags: pr-validation/${{ matrix.image.name }}:test
          # Public, non-sensitive build-args from the per-repo config.
          # Sensitive values must come via the `build-secrets` workflow
          # secret (BuildKit secrets, never written to image layers).
          build-args: ${{ matrix.image.build-args || '' }}
          secrets: ${{ secrets.build-secrets }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  helm-lint:
    name: PR / Helm Lint
    needs: parse-config
    if: needs.parse-config.outputs.helm-lint-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - uses: helm/chart-testing-action@v2.7.0
      - name: List changed charts
        id: list-changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          changed=$(ct list-changed --target-branch "$base")
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts:"; echo "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: ct lint
        if: steps.list-changed.outputs.changed == 'true'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          # release-please owns version bumps on merge to main, so we
          # disable the version-increment check here.
          ct lint --target-branch "$base" --check-version-increment=false --validate-maintainers=false
      - name: helm template
        if: steps.list-changed.outputs.changed == 'true'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          for d in $(ct list-changed --target-branch "$base"); do
            echo "::group::helm template $d"
            helm template "$d"
            echo "::endgroup::"
          done

  pulumi-preview:
    name: PR / Pulumi Preview
    needs: parse-config
    if: needs.parse-config.outputs.pulumi-preview-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ needs.parse-config.outputs.pulumi-project-dir }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mossworks-labs'
      - name: npm ci
        working-directory: ${{ needs.parse-config.outputs.pulumi-project-dir }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: ${{ needs.parse-config.outputs.pulumi-stack }}
          work-dir: ${{ needs.parse-config.outputs.pulumi-project-dir }}
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  storybook:
    name: PR / Storybook
    needs: parse-config
    if: needs.parse-config.outputs.storybook-enabled == 'true'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mossworks-labs'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run build-storybook --if-present

  # ─── Aggregate verdict ───────────────────────────────────────────────────
  # `if: always()` so this runs even when an upstream job fails. Each
  # `needs.<job>.result` is one of: success | failure | cancelled | skipped.
  # We treat success+skipped as OK; anything else fails the aggregate.
  # The org-level ruleset requires *this* check to pass — it's the single
  # required status check, so toggling individual checks via per-repo
  # config never breaks branch protection.
  aggregate:
    name: PR / aggregate
    needs:
      - parse-config
      - lint
      - typecheck
      - format-check
      - build
      - test
      - docker
      - helm-lint
      - pulumi-preview
      - storybook
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tally results
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          tally() {
            local name="$1" result="$2"
            case "$result" in
              success|skipped) printf '✓ %-18s %s\n' "$name" "$result" ;;
              *)               printf '✗ %-18s %s\n' "$name" "$result"; FAILED=1 ;;
            esac
          }
          tally "parse-config"     "${{ needs.parse-config.result }}"
          tally "lint"             "${{ needs.lint.result }}"
          tally "typecheck"        "${{ needs.typecheck.result }}"
          tally "format-check"     "${{ needs.format-check.result }}"
          tally "build"            "${{ needs.build.result }}"
          tally "test"             "${{ needs.test.result }}"
          tally "docker"           "${{ needs.docker.result }}"
          tally "helm-lint"        "${{ needs.helm-lint.result }}"
          tally "pulumi-preview"   "${{ needs.pulumi-preview.result }}"
          tally "storybook"        "${{ needs.storybook.result }}"
          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "PR validation failed — see the job results above."
            exit 1
          fi
          echo
          echo "All required checks passed."

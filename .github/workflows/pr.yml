name: validation

# Trampoline that calls the org's universal PR validation workflow on
# this repo's own PRs. The reusable workflow now lives in
# Mossworks-Labs/actions; this repo only carries community-health files
# (CoC, CONTRIBUTING, SECURITY, ISSUE_TEMPLATE, PULL_REQUEST_TEMPLATE,
# profile/, workflow-templates/) and needs validation only for those.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validation:
    uses: Mossworks-Labs/actions/.github/workflows/pr.yml@main
    permissions:
      contents: read
      packages: read
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
